{% extends "base.html" %}

{% block body %}
<main id="main-content" class="auth-layout">
    <section class="auth-story auth-story-login">
        <a class="wordmark wordmark-light" href="/">智语桥 <span>ZHIYUQIAO</span></a>
        <div class="story-copy">
            <p class="kicker kicker-light">欢迎回来</p>
            <h1>从一句中文，<br>走进一座城市。</h1>
            <p class="story-description">
                <span>教师在这里备课、核验教学内容；</span>
                <span>学习者在这里探索海派文化，在真实场景中练习中文。</span>
            </p>
        </div>
        <blockquote>“语言是桥，真实任务让桥通向生活。”</blockquote>
        <div class="skyline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </section>
    <section class="auth-form-panel">
        <div class="auth-form-wrap auth-form-compact">
            <div class="auth-heading">
                <p class="kicker">登录</p>
                <h2>进入你的智语桥</h2>
                <p>登录后，系统会根据你的身份进入学生学习空间或教师工作台。</p>
            </div>
            {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
            <form method="post" class="stack-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label class="field"><span>账号或显示名称</span><input type="text" name="identifier" value="{{ identifier }}" placeholder="请输入账号" autocomplete="username" required></label>
                <label class="field"><span>密码</span><input type="password" name="password" placeholder="请输入密码" autocomplete="current-password" required></label>
                <button class="primary-btn primary-btn-large" type="submit">登录 <span>→</span></button>
            </form>
            <div class="role-entry-note"><span>学生</span> 文化探索 · 口语陪练 · 中文反馈 <br><span>教师</span> 海派课程 · 教学设计 · 标准政策</div>
            <p class="auth-footer">还没有账号？ <a href="/register">选择身份并注册</a></p>
        </div>
    </section>
</main>
{% endblock %}
