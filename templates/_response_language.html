<div class="reply-language-row">
    <label for="response-language">{{ t('chat.reply_language') }}</label>
    <select id="response-language" aria-describedby="response-language-hint">
        <option value="auto">{{ t('chat.reply_auto') }}</option>
        <option value="profile">{{ t('chat.reply_profile') }} · {{ user.instruction_language }}</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
    </select>
    <span id="response-language-hint">{{ t('chat.reply_hint') }}</span>
</div>
