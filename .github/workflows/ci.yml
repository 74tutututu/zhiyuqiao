name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ci-placeholder
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Install web runtime and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt ruff==0.15.5
      - name: Static checks
        run: |
          python -m compileall -q main.py core
          ruff check main.py core test_role_security.py test_learning_workflow.py test_retriever_regressions.py test_minimal_launch.py
      - name: Role, privacy, workflow and retrieval regressions
        run: |
          python test_role_security.py
          python test_learning_workflow.py
          python test_retriever_regressions.py
          python test_minimal_launch.py
